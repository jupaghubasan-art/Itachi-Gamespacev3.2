name: Build SanjuSystemX APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          # If the repository contains the project as a ZIP, unpack it.
          if ! find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit | grep -q .; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit || true)"
            if [ -n "$ZIP_FILE" ]; then
              echo "No Gradle project found. Unpacking: $ZIP_FILE"
              unzip -oq "$ZIP_FILE"
            fi
          fi

          SETTINGS_FILE="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle.kts or settings.gradle was found."
            echo "The repository must contain the Android/Gradle source project."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          PROJECT_ROOT="${PROJECT_ROOT#./}"
          [ -n "$PROJECT_ROOT" ] || PROJECT_ROOT="."

          if [ ! -f "$PROJECT_ROOT/build.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "ERROR: Gradle settings file was found, but the project root has no build.gradle(.kts)."
            echo "Detected root: $PROJECT_ROOT"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected Gradle project root: $PROJECT_ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        run: |
          set -e
          echo "Building from: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"
          gradle -p "$PROJECT_ROOT" projects --stacktrace

      - name: Build debug and release APKs
        run: |
          set -e
          gradle -p "$PROJECT_ROOT" assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Show generated APKs
        run: |
          find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*.apk' -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SanjuSystemX-release-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
